name: Widget previews

# Home-screen widgets: JVM logic tests + Robolectric renders of the real
# RemoteViews layouts (day/night) as PNGs (picker previewImage + screenshots).
on:
  push:
    branches: [feature-widgets]
    paths:
      - 'android/app/src/main/res/**'
      - 'android/app/src/main/kotlin/com/neovarch/agent/Nv*Widget*.kt'
      - 'android/app/src/main/kotlin/com/neovarch/agent/NvWidgets.kt'
      - 'android/app/src/test/**'
      - '.github/workflows/widget-previews.yml'
  workflow_dispatch:

jobs:
  widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Widget tests + renders
        working-directory: android
        env:
          NVW_SHOTS_DIR: ${{ github.workspace }}/widget-renders
        run: |
          flutter build apk --config-only
          ./gradlew :app:testDebugUnitTest --tests 'com.neovarch.agent.NvWidget*' --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-renders
          path: |
            widget-renders/*.png
            build/app/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
