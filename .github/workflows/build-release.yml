name: Build release (Linux, Windows, Android)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'
  APP_VERSION: '1.1.0'

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package
        run: |
          BUNDLE=build/linux/x64/release/bundle
          mkdir -p dist/neovarch-agent
          cp -r $BUNDLE/. dist/neovarch-agent/
          cp assets/brand/app_icon.png dist/neovarch-agent/neovarch-agent.png
          cat > dist/neovarch-agent/neovarch-agent.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Neovarch Agent
          Comment=Autonomous AI agent
          Exec=neovarch-agent
          Icon=neovarch-agent
          Terminal=false
          Categories=Development;Utility;
          StartupWMClass=com.neovarch.agent
          EOF
          sed -i 's/^ *//' dist/neovarch-agent/neovarch-agent.desktop
          tar -C dist -czf neovarch-agent-linux-x64.tar.gz neovarch-agent

      - uses: actions/upload-artifact@v4
        with:
          name: neovarch-agent-linux-x64
          path: neovarch-agent-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "dist/Neovarch Agent" | Out-Null
          Copy-Item -Recurse -Path "$rel/*" -Destination "dist/Neovarch Agent"
          Compress-Archive -Path "dist/Neovarch Agent" -DestinationPath neovarch-agent-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: neovarch-agent-windows-x64
          path: neovarch-agent-windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release

      - name: Rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/neovarch-agent-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/neovarch-agent-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: neovarch-agent-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pack npm launcher
        run: |
          cd npm
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          npm pack
          mv "neovarch-agent-$APP_VERSION.tgz" ../artifacts/neovarch-agent-npm.tgz

      - run: ls -la artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Neovarch Agent ${{ env.APP_VERSION }}
          body: |
            Neovarch Agent ${{ env.APP_VERSION }}

            Install:
            - Linux (x64): curl -fsSL https://raw.githubusercontent.com/Maftuuh1922/neovrach_Agent/main/scripts/install.sh | sh
            - Windows (x64, PowerShell): irm https://raw.githubusercontent.com/Maftuuh1922/neovrach_Agent/main/scripts/install.ps1 | iex
            - npm (Node 18+): npm i -g https://github.com/Maftuuh1922/neovrach_Agent/releases/latest/download/neovarch-agent-npm.tgz

            Downloads:
            - Windows (x64): neovarch-agent-windows-x64.zip — unzip and run NeovarchAgent.exe
            - Linux (x64): neovarch-agent-linux-x64.tar.gz — extract and run ./neovarch-agent (needs GTK 3)
            - Android: neovarch-agent-android-universal.apk, or neovarch-agent-android-arm64.apk for most modern phones

            Desktop notes: phone-only tools (contacts, location, calendar, device storage, camera) are hidden on desktop. Voice dictation and read-aloud are available on Windows but not yet on Linux.
          files: artifacts/*
          fail_on_unmatched_files: true
          make_latest: true
