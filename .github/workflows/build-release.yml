name: Build release (Android, npm launcher)

# Flutter builds only the Android phone app (the remote). The desktop app is
# Electron and is built by desktop-electron.yml, which attaches its installers
# to the same release when a v* tag is pushed.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'
  APP_VERSION: '1.2.0'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - run: flutter build apk --release

      - name: Rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/neovarch-agent-android-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/neovarch-agent-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: neovarch-agent-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pack npm launcher
        run: |
          cd npm
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          npm pack
          mv "neovarch-agent-$APP_VERSION.tgz" ../artifacts/neovarch-agent-npm.tgz

      - run: ls -la artifacts

      - name: Release notes
        run: |
          cat > notes.md <<EOF
          Neovarch Agent ${APP_VERSION}

          The desktop app is now built on Electron (a fork of Hermes Desktop by Nous Research, MIT) and drives the Hermes Agent core. The phone app is the remote.

          Phone remote: on the PC open Settings > Remote / Perangkat > Aktifkan akses remote, then scan the QR from the phone app (same Wi-Fi/LAN or Tailscale; allow port 9119).

          Install:
          - Linux (x64): \`curl -fsSL https://raw.githubusercontent.com/Maftuuh1922/neovrach_Agent/main/scripts/install.sh | sh\`
          - Windows (x64, PowerShell): \`irm https://raw.githubusercontent.com/Maftuuh1922/neovrach_Agent/main/scripts/install.ps1 | iex\`
          - npm (Node 18+): \`npm i -g https://github.com/Maftuuh1922/neovrach_Agent/releases/latest/download/neovarch-agent-npm.tgz\`

          Downloads:
          - Windows (x64): neovarch-agent-windows-x64-setup.exe (installer), or neovarch-agent-windows-x64.zip (portable, run "Neovarch Agent.exe")
          - Linux (x64): neovarch-agent-linux-x64.AppImage, neovarch-agent-linux-x64.tar.gz (run ./neovarch-agent), or neovarch-agent-linux-x64.deb
          - Android: neovarch-agent-android-universal.apk, or neovarch-agent-android-arm64.apk for most modern phones

          On first launch the desktop app installs the Neovarch core (Hermes Agent) if it is missing, or connects to an existing Hermes gateway.
          Builds are unsigned: Windows SmartScreen may ask you to confirm ("More info" → "Run anyway").
          EOF
          sed -i 's/^          //' notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then TAG="${GITHUB_REF_NAME}"; fi
          TARGET_FLAG=""
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then TARGET_FLAG="--target $GITHUB_SHA"; fi
          # desktop-electron.yml attaches to the same tag; whichever job gets there first creates it.
          for i in 1 2 3 4 5; do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" $TARGET_FLAG --title "Neovarch Agent ${APP_VERSION}" \
              --notes-file notes.md >/dev/null 2>&1 && break
            sleep 10
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Neovarch Agent ${APP_VERSION}" \
            --notes-file notes.md --latest --draft=false
          gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
